{% extends "base.html" %}
{% block title %}Sign Up — NutriPulse{% endblock %}

{% block content %}
<div class="auth-container fade-in">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <span class="auth-logo">⚡</span>
            <h1>Join NutriPulse</h1>
            <p class="auth-subtitle">Start tracking your nutrition with AI</p>
        </div>
        <form method="POST" action="{{ url_for('signup') }}" class="auth-form" id="signup-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="signup-btn">Create Account</button>
        </form>
        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
